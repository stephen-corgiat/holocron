# Production stack for Holocron, run from the published images.
# See docs/deployment.md. Put this next to a filled-in .env (from
# .env.example) and run `docker compose up -d`.
name: holocron

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-holocron}
      POSTGRES_USER: ${POSTGRES_USER:-holocron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - holocron-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-holocron} -d ${POSTGRES_DB:-holocron}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/stephen-corgiat/holocron/api:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - /app/node_modules/typeorm/cli.js
      - migration:run
      - -d
      - /app/apps/api/dist/database/data-source.js

  api:
    image: ghcr.io/stephen-corgiat/holocron/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      API_PORT: 3000   # in-container port; the host port is API_PORT below
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    image: ghcr.io/stephen-corgiat/holocron/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  holocron-pgdata: {}
