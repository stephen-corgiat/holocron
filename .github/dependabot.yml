version: 2
updates:
  # Root lockfile covers every workspace (apps/api, apps/web, apps/e2e).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Postgres image tag in the dev and production compose files.
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
